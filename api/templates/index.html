<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RateMyStock</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --border: #202a37;
    --text: #e7edf3;
    --muted: #8ea0b3;
    --bull: #2fbf71;
    --bear: #e6584e;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }
  .sub {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 28px;
  }
  form {
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
    text-transform: uppercase;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #05131f;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { color: var(--muted); margin-top: 14px; min-height: 20px; }
  #overall {
    margin-top: 24px;
    padding: 14px 16px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    display: none;
  }
  .card {
    margin-top: 16px;
    padding: 16px 18px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .headline { font-weight: 600; margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 13px; }
  .bar-track { flex: 1; height: 8px; border-radius: 4px; background: #1c2531; overflow: hidden; }
  .bar-fill { height: 100%; }
  .bear-fill { background: var(--bear); }
  .bull-fill { background: var(--bull); }
  .gemini { margin-top: 12px; font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .gemini strong { color: var(--text); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📈 RateMyStock</h1>
    <p class="sub">Naive Bayes + Gemini sentiment analysis on the latest headlines for a ticker.</p>

    <form id="tickerForm">
      <input type="text" id="ticker" placeholder="e.g. MSFT" maxlength="10" required />
      <button type="submit" id="submitBtn">Analyze</button>
    </form>
    <div id="status"></div>

    <div id="overall"></div>
    <div id="results"></div>
  </div>

<script>
  const form = document.getElementById("tickerForm");
  const tickerInput = document.getElementById("ticker");
  const statusEl = document.getElementById("status");
  const overallEl = document.getElementById("overall");
  const resultsEl = document.getElementById("results");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const ticker = tickerInput.value.trim();
    if (!ticker) return;

    submitBtn.disabled = true;
    statusEl.textContent = `Fetching headlines and scoring sentiment for ${ticker.toUpperCase()}...`;
    overallEl.style.display = "none";
    resultsEl.innerHTML = "";

    try {
      const res = await fetch(`/api/analyze?ticker=${encodeURIComponent(ticker)}`);
      const data = await res.json();

      if (!res.ok) {
        statusEl.textContent = data.error || "Something went wrong.";
        return;
      }

      statusEl.textContent = "";

      if (data.overall) {
        overallEl.style.display = "block";
        overallEl.innerHTML = `<strong>Overall take:</strong> ${escapeHtml(data.overall)}`;
      }

      data.results.forEach((r) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="headline">${escapeHtml(r.headline)}</div>
          <div class="bar-row">
            <span>Bearish</span>
            <div class="bar-track"><div class="bar-fill bear-fill" style="width:${r.naive_bayes.bearish}%"></div></div>
            <span>${r.naive_bayes.bearish}%</span>
          </div>
          <div class="bar-row">
            <span>Bullish</span>
            <div class="bar-track"><div class="bar-fill bull-fill" style="width:${r.naive_bayes.bullish}%"></div></div>
            <span>${r.naive_bayes.bullish}%</span>
          </div>
          <div class="gemini"><strong>Gemini:</strong> ${escapeHtml(r.gemini)}</div>
        `;
        resultsEl.appendChild(card);
      });
    } catch (err) {
      statusEl.textContent = "Network error — please try again.";
    } finally {
      submitBtn.disabled = false;
    }
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }
</script>
</body>
</html>
